<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container py-4">
      <div class="row mb-3">
        <div class="col-8 col-md-8">
          <h1 class="h4">Weight Tracker</h1>
        </div>
        <div class="col-4 text-end">
          <a href="weight-chart.html" class="btn btn-outline-primary btn-sm">Charts</a>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-12 col-md-6">
          <div class="input-group">
            <input type="text" id="weight" name="weight" class="form-control" placeholder="Enter weight" />
            <button class="btn btn-primary" id="submitWeightBtn" type="button">Submit</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="table-responsive">
            <table id="weightTbl" class="table table-striped table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Date</th>
                  <th>Weight</th>
                  <th>Run</th>
                  <th>Strength</th>
                  <th>Delete</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="supabase.js"></script>
    <script src="weights.js"></script>
  </body>
</html>
